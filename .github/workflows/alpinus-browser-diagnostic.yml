name: Alpinus Browser Diagnostic

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r alpinus/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python alpinus/probe.py
        env:
          ALPINUS_BASE_URL: https://alpinusgroup.com
