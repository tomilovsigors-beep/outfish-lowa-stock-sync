name: Alpinus offline safety tests
on:
  pull_request:
    paths:
      - 'alpinus_sync/**'
      - '.github/workflows/alpinus-offline-tests.yml'
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r alpinus/requirements.txt
      - run: python -m unittest discover -s alpinus_sync -p 'test_*.py' -v
